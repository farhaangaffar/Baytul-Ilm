<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3c5e" />
    <title>Suhuf — madrasah management app: registers, fees, Qur'an progress and reports</title>
    <meta name="description" content="Suhuf is a simple app for UK madaaris, maktabs, Darul Ulooms and Aalimiyyah courses: attendance registers, fees, Hifdh and Qur'an progress, behaviour, AI-written reports and a parent portal. Free for 6 months." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Suhuf" />
    <meta property="og:title" content="Suhuf — your whole madrasah, in one simple app" />
    <meta property="og:description" content="Registers, fees, Qur'an progress, reports and a parent portal for madaaris, maktabs, Darul Ulooms and Aalimiyyah courses. Free for 6 months." />
    <meta property="og:url" content="https://www.suhuf.uk/" />
    <!-- Served by api/settings so the installed app is named after the madrasah -->
    <link rel="manifest" href="/api/settings?manifest" />
    <!-- The madrasah's uploaded logo as a square icon, or the built-in one if none (see api/settings) -->
    <link rel="icon" type="image/png" href="/api/settings?icon" />
    <link rel="apple-touch-icon" href="/api/settings?icon" />
    <script>
      // Many madaaris share this site: this device remembers which one it signs in to
      // (src/lib/madrasahCode.js), so the install name and icons are that madrasah's.
      try {
        var code = localStorage.getItem('madrasah_code');
        if (code) {
          var m = '&m=' + encodeURIComponent(code);
          document.querySelectorAll('link[rel=manifest], link[rel=icon], link[rel=apple-touch-icon]').forEach(function (l) { l.href = l.getAttribute('href') + m; });
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Suhuf — your whole madrasah, in one simple app</h1>
      <p>Attendance registers, fees, Hifdh and Qur'an progress, behaviour records, AI-written reports and a parent portal
        for UK madaaris and maktabs. Free for 6 months, then £20 a month or £200 a year. Please turn on JavaScript to use Suhuf.</p>
    </noscript>
  </body>
</html>
